# fastgpt-sync-adapter 生产配置模板
# 使用方法：复制本文件为 config.yaml 并填入业务凭据即可开箱即用：
#   cp config.example.yaml config.yaml
# 注：config.yaml、private.pem 已被 .gitignore 严格忽略，避免将生产密钥提交至代码仓库。

# ==============================================================================
# 1. 对外服务与接口（集成端点）
# ==============================================================================

# FastGPT API 文件库 HTTP 服务（常驻单进程服务，提供文件流与 Web 浏览器）
# FastGPT 控制台添加「API 文件库」数据源时，填写：http://<IP>:8080/v1/file/list
server:
  enabled: true                    # 随主服务常驻启动
  addr: ":8080"                    # FastGPT 接口监听地址与内嵌 Web 浏览器页面
  token: "dev-token"               # FastGPT Bearer 鉴权 Token（建议生产环境更换为复杂随机密钥）
  external_url: ""                 # 对外暴露地址（经反代/隧道暴露时填写，如 https://file.example.com；留空自动推断）

# 飞书 OAuth 授权服务（员工通过此页面完成飞书账号授权）
# 员工打开该链接完成扫码：http://<IP>:8089/oauth/feishu/start
auth:
  enabled: true
  addr: ":8089"                    # 飞书授权回调监听地址（需与飞书开放平台后台配置的回调地址一致）
  external_url: ""                 # 挂公网域名/反代时填写，留空自动按请求 Host 推断

# ==============================================================================
# 2. 存储后端（群晖 NAS 归档配置）
# ==============================================================================
sinks:
  nas:
    enabled: true
    url: "https://nas.example.com:5001"    # 群晖 NAS 地址（支持环境变量 NAS_URL 覆盖）
    username: "FastGPT"                   # 拥有读写权限的群晖账号
    password: "YourPassword"              # 群晖账号密码
    root_path: "/FastGPT-test"             # 归档根路径（必须以 NAS 上已创建的共享文件夹开头）
    max_file_size_mb: 200                  # 单附件大小上限（MB，默认 200），超出跳过下载以防 OOM 崩溃

  # [可选] FastGPT 主动按人推送（一人一库模式；默认通过上方的 API 文件库被动拉取即可）
  fastgpt:
    enabled: false                         # 需要适配器主动调用 FastGPT OpenAPI 推送建库时设为 true
    base_url: "https://cloud.fastgpt.cn"   # FastGPT 域名（自建填写自建域名）
    api_key: "fastgpt-xxxxxxxxxxxx"        # FastGPT 账号级 API Key
    interval: 5m                           # 主动推送巡检周期

# ==============================================================================
# 3. 数据源：企业微信（会话存档）
# ==============================================================================
connectors:
  wecom:
    enabled: true                          # 是否启用企微会话归档
    corp_id: "ww1234567890abcdef"          # 企业微信 CorpID
    secret: "YourWeComChatSecret"          # 会话内容存档 Secret
    rsa_private_key_file: "./private.pem"  # 解密消息用的 RSA 私钥文件路径
    interval: 60s                          # 增量拉取轮询间隔

  # ==============================================================================
  # 4. 数据源：飞书（云文档 + 邮件 + 知识库）
  # ==============================================================================
  feishu:
    enabled: true                          # 是否启用飞书同步
    app_id: "cli_1234567890abcdef"         # 飞书自建应用 App ID
    app_secret: "YourFeishuAppSecret"      # 飞书自建应用 App Secret
    interval: 5m                           # 增量扫描周期（建议 100 人规模设置为 15m~30m）
    mode: "both"                           # both（个人云文档 + 团队知识库）/ user（仅个人云文档）
    shared_discover_interval: 1h           # 搜索别人共享给员工的文件夹的周期（每人每次约 名单人数/20 次搜索；300 人以上建议 2h，500 人以上 3h）
    mail_max_per_round: 100                # 每人每轮最多处理多少封还没存过的邮件（邮件详情接口 100 次/分钟，每 100 封约 1 分钟；历史邮件分多轮补齐）

# ==============================================================================
# 5. 跨平台实名身份解析（企微 UserID ↔ 飞书 OpenID ↔ 员工真实姓名）
# ==============================================================================
identity:
  source: bitable                          # bitable（飞书多维表格自动同步，推荐）/ local（本地 JSON 文件）
  local_file: "./identity_map.json"        # source=local 时的离线备份映射表
  bitable:
    app_token: "bascnxxxxxxxxxxxxxxxxxxxxxx" # 多维表格 base app_token
    table_id: "tblxxxxxxxxxxxx"            # 数据表 ID
    app_id: "cli_1234567890abcdef"         # 读取多维表格的应用凭证（建议直接使用飞书同步应用，消除跨应用 open_id 差异）
    app_secret: "YourFeishuAppSecret"
    refresh_interval: 1h                   # 全员名单自动定时刷新间隔
