# gitleaks 配置：CI 的 secrets job 会用本文件。
# 保留官方默认规则集，只放行测试里几个明显的顺序字符假值；
# 按值放行而不是按文件放行，测试文件里真混进了凭证照样会被扫出来；
# 正则首尾锚定，只有和假值完全相同的串才放行。

[extend]
useDefault = true

[allowlist]
description = "测试用的顺序字符假值（非真实凭证）"
regexes = [
  # internal/apitoken/apitoken_test.go、internal/config/config_test.go
  '''^(?:fsa_)?abcdefghijklmnopqrstuvwxyz0123456789(?:ABCDEFG)?$''',
  # internal/server/server_test.go 的 signTestSecret
  '''^0123456789abcdef0123456789abcdef$''',
  # internal/config/config_test.go 的 admin_token / sign_secret
  '''^1234567890123456789012345678901(?:2)?$''',
]
